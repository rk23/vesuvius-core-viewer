[project]
name = "vesuvius-core-viewer"
version = "0.1.0"
description = "A local browser viewer for the centers of CT-scanned papyrus scrolls."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
build = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "pillow>=10.4,<13",
  "zarr>=2.18,<3",
  "numcodecs>=0.15,<0.16",
  "fsspec>=2024.6",
  "s3fs>=2024.6",
  "scikit-image>=0.24,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.6,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
