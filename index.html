<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesuvius Core Viewer</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script>
</head><body>
<div id="app"><div id="view"><div id="loading" role="status">Loading scene…</div><div id="hud"></div></div>
<div id="panel">
<h1>Vesuvius Core Viewer</h1>
<label for="sceneSelect">Scroll <select id="sceneSelect" aria-label="Scroll"></select></label>
<label for="sceneFile">Open scene file</label><input type="file" id="sceneFile" accept=".json,.gz" aria-label="Open scene file">
<h2 id="title"></h2>
<div class="muted" id="about"></div>
<fieldset><legend>Views</legend>
<button id="vTop">Top (x–y)</button><button id="vFront">Front (x across)</button>
<button id="vSide">Side (y across)</button><button id="vFocus">Centre on slice</button>
<button id="vFit">Fit view</button></fieldset>
<fieldset><legend>Feature points</legend>
<label><input type="checkbox" id="gOn" checked> show</label>
<label>colour <select id="gCol"><option value="angle">angle around axis</option><option value="z">height</option>
<option value="r">distance from axis</option></select></label>
<label>z from <input type="range" id="zMin"><span class="val" id="zMinV"></span></label>
<label>z to <input type="range" id="zMax"><span class="val" id="zMaxV"></span></label>
<label>max r <input type="range" id="rMax" step="0.1"><span class="val" id="rMaxV"></span></label>
<label>size <input type="range" id="pSize" min="0.5" max="6" step="0.1" value="1.6"><span class="val" id="pSizeV"></span></label>
</fieldset>
<fieldset id="outline"><legend>Scroll outline</legend>
<label><input type="checkbox" id="envOn" checked> show</label>
<label>opacity <input type="range" id="envOp" min="0.05" max="1" step="0.05" value="0.35"><span class="val" id="envOpV"></span></label>
</fieldset>
<fieldset><legend>CT slice</legend>
<label><input type="checkbox" id="sOn" checked> show</label>
<label>z <input type="range" id="sZ"><span class="val" id="sZV"></span></label>
<label>opacity <input type="range" id="sOp" min="0.1" max="1" step="0.05" value="0.9"><span class="val" id="sOpV"></span></label>
<label><input type="checkbox" id="sClip"> hide points above the slice</label>
</fieldset>
<fieldset><legend>Other</legend>
<label><input type="checkbox" id="tOn" checked> axis</label>
</fieldset>

<div class="muted" id="stats"></div>
<fieldset><legend>Data source</legend><div class="muted" id="attribution"></div><p id="axisNote" class="muted"></p>
<a id="volumeLink" target="_blank" rel="noreferrer">Source CT volume</a><br>
<a href="ATTRIBUTION.md" target="_blank" rel="noreferrer">Credits and licenses</a></fieldset>
</div></div>
<script type="module" src="app.js"></script></body></html>
